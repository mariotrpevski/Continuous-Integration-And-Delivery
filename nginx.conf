events {}

http {
    include /etc/nginx/mime.types;

    server {
        listen 80;

        # Serve static frontend files
        location / {
            root /usr/share/nginx/html;
            index login.html;
            try_files $uri $uri/ =404;
        }

        # Proxy all API routes to the backend
        location /register { proxy_pass http://backend:8080; }
        location /confirm { proxy_pass http://backend:8080; }
        location /login { proxy_pass http://backend:8080; }
        location /verify-2fa { proxy_pass http://backend:8080; }
        location /logout { proxy_pass http://backend:8080; }
        location /me { proxy_pass http://backend:8080; }
        location /admin { proxy_pass http://backend:8080; }
        location /user { proxy_pass http://backend:8080; }
    }
}